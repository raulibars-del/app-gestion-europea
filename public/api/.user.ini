; Límites de PHP para esta carpeta (subida de archivos y guardado de datos).
; IONOS respeta .user.ini en hosting compartido con PHP-FPM.
post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
max_execution_time = 120
; Tiempo máximo para recibir/parsear los datos de entrada (independiente de
; max_execution_time): con el bloque de datos pesando varios MB y subiéndose
; entero en cada guardado, en una conexión lenta puede agotarse el límite por
; defecto (60s) antes de que max_execution_time entre en juego siquiera.
max_input_time = 120
