name: Deploy to gestion.europeademaquinaria.com

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Generar config.php con credenciales de BD
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cat > public/api/config.php << EOF
          <?php
          define('DB_HOST', '$DB_HOST');
          define('DB_NAME', '$DB_NAME');
          define('DB_USER', '$DB_USER');
          define('DB_PASS', '$DB_PASS');
          define('API_KEY', '$API_KEY');
          EOF
          echo "VITE_API_KEY=$API_KEY" > .env.production

      - name: Construir app
        run: npm run build

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Desplegar vía SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" \
            -e "set sftp:auto-confirm yes; set net:timeout 15; mirror --reverse --delete --verbose --exclude-glob api/uploads/ dist/ /gestion/; bye" \
            sftp://home444205640.1and1-data.host:22

