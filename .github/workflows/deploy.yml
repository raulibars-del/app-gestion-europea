name: Deploy to europeademaquinaria.com/gestion

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Construir app
        run: npm run build

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Desplegar vía SFTP
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set net:timeout 15;
          set net:max-retries 3;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} sftp://home444205640.1and1-data.host:22;
          mirror --reverse --delete --verbose ./dist/ /gestion/;
          bye;
          "
