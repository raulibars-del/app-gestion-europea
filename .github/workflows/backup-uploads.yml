name: Backup semanal de archivos subidos (Chat)

on:
  schedule:
    - cron: '0 3 * * 1'   # cada lunes a las 03:00 UTC
  workflow_dispatch: {}    # también se puede lanzar a mano desde GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cambiar a la rama "backups" (crearla si no existe)
        run: |
          git fetch origin backups 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/backups; then
            git checkout backups
            git pull origin backups --ff-only || true
          else
            git checkout --orphan backups
            git rm -rf . > /dev/null 2>&1 || true
            mkdir -p uploads
            echo "Copias de seguridad semanales de public/api/uploads/. Esta rama no se despliega ni se mezcla con main." > README.md
            git add README.md
          fi

      - name: Instalar dependencias
        run: sudo apt-get install -y lftp sshpass zip

      - name: Descargar api/uploads/ del servidor IONOS
        env:
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          rm -rf /tmp/descarga && mkdir -p /tmp/descarga
          echo "Conectando a SFTP como ${SFTP_USER:0:4}***..."

          # Método 1: lftp (manejo nativo de contraseña)
          if lftp -u "$SFTP_USER,$SFTP_PASS" \
              -e "set sftp:auto-confirm yes; set net:timeout 30; set net:max-retries 2; mirror /gestion/api/uploads/ /tmp/descarga/; bye" \
              sftp://home444205640.1and1-data.host:22; then
            echo "✓ Descarga completada con lftp"
          else
            echo "lftp falló — intentando con sshpass+sftp..."
            printf 'lcd /tmp/descarga\nget -r /gestion/api/uploads/.\nbye\n' > /tmp/sftp.batch
            sshpass -p "$SFTP_PASS" sftp \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -b /tmp/sftp.batch \
              "$SFTP_USER@home444205640.1and1-data.host"
            echo "✓ Descarga completada con sshpass"
          fi

          TOTAL=$(find /tmp/descarga -type f | wc -l)
          echo "Archivos descargados: $TOTAL"

      - name: Empaquetar todo en un único zip con fecha
        run: |
          FECHA=$(date +%Y-%m-%d)
          mkdir -p uploads
          if [ -z "$(ls -A /tmp/descarga 2>/dev/null)" ]; then
            echo "No hay archivos en api/uploads/ todavía, no se crea zip."
          else
            (cd /tmp/descarga && zip -rq /tmp/backup-uploads-$FECHA.zip .)
            mv /tmp/backup-uploads-$FECHA.zip uploads/
            git add uploads/backup-uploads-$FECHA.zip
          fi

      - name: Commit y push
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          if git commit -m "Backup semanal de api/uploads/ - $(date +%Y-%m-%d)"; then
            git push origin backups
          else
            echo "Nada nuevo que respaldar esta semana — no se hace push."
          fi
